<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="statediagram" style="max-width: 295.125px; background-color: white;" viewBox="0 0 295.125 336" role="graphics-document document" aria-roledescription="stateDiagram" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg"><title id="chart-title-my-svg">Allocation lifecycle with guarded transitions</title><desc id="chart-desc-my-svg">Creation produces held. Before its deadline an owner may confirm or release. At the deadline a hold expires. Confirmed may become cancelled before the cutoff. Cancelled releases the seat and accepts a refund obligation; it does not mean the refund is settled. Full authority and input guards are in the chapter table.</desc><style>#my-svg{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#111827;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#FFFBEB;}#my-svg .error-text{fill:#000414;stroke:#000414;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#374151;stroke:#374151;}#my-svg .marker.cross{stroke:#374151;}#my-svg svg{font-family:Arial,Helvetica,sans-serif;font-size:18px;}#my-svg p{margin:0;}#my-svg defs [id$="-barbEnd"]{fill:#374151;stroke:#374151;}#my-svg g.stateGroup text{fill:#0369A1;stroke:none;font-size:10px;}#my-svg g.stateGroup text{fill:#111827;stroke:none;font-size:10p